```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S Brain Test</title>
    <style>
        body { background: #000; color: #0ff; font-family: monospace; padding: 20px; }
        h1 { text-align: center; letter-spacing: 4px; }
        #status { color: #f00; text-align: center; margin-bottom: 15px; font-weight: bold; }
        textarea { width: 100%; background: #001a1a; color: #0ff; border: 1px solid #0ff; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #0ff; color: #000; font-weight: bold; border: none; margin-top: 10px; font-size: 16px; cursor: pointer; }
        button:hover { background: #00cccc; }
        #reply { border: 1px solid #0ff; padding: 12px; margin-top: 15px; min-height: 100px; white-space: pre-wrap; color: #fff; }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S</h1>
    <div id="status">BRAIN: NOT CONNECTED</div>
    <textarea id="prompt" rows="4">Hello J.A.R.V.I.S, acknowledge command.</textarea>
    <button onclick="ask()">SEND REQUEST</button>
    <div id="reply">Waiting for response...</div>

    <script>
        // ⚠️ WARNING: Never share this file publicly if your API key is inside.
        const API_KEY = "   ";

        async function ask() {
            const prompt = document.getElementById("prompt").value;
            const status = document.getElementById("status");
            const reply = document.getElementById("reply");

            reply.innerText = "PROCESSING...";
            status.innerText = "CONNECTING...";
            status.style.color = "#ff0";

            try {
                const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    }
                );
                
                const data = await res.json();
                
                if (data.candidates && data.candidates[0].content) {
                    reply.innerText = data.candidates[0].content.parts[0].text;
                    status.innerText = "✔ BRAIN ONLINE";
                    status.style.color = "#0f0";
                } else {
                    reply.innerText = "ERROR: " + (data.error ? data.error.message : "Unknown error");
                    status.innerText = "BRAIN ERROR";
                    status.style.color = "#f00";
                }
            } catch (e) {
                reply.innerText = "ERROR: " + e.message;
                status.innerText = "CONNECTION FAILED";
                status.style.color = "#f00";
            }
        }
    </script>
</body>
</html>
